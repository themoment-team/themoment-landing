<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- What iOS puts on a home screen and what Android uses for a bookmark.
         Neither takes the SVG, and with nothing here iOS screenshots the page
         and uses that — a shrunken picture of the hero where the mark should
         be. Drawn from the same favicon by scripts/touch-icon.html; the
         command is in that file. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>THE MOMENT — 광주소프트웨어마이스터고 학생 개발팀</title>
    <meta
      name="description"
      content="더모먼트는 현장에서 답을 찾는 개발 파트너입니다. 가장 필요한 곳에 가장 먼저 도착하는 기술로 더 나은 경험을 만듭니다."
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="THE MOMENT" />
    <meta
      property="og:title"
      content="THE MOMENT — 광주소프트웨어마이스터고 학생 개발팀"
    />
    <meta
      property="og:description"
      content="더모먼트는 현장에서 답을 찾는 개발 파트너입니다. 가장 필요한 곳에 가장 먼저 도착하는 기술로 더 나은 경험을 만듭니다."
    />
    <!-- The card every platform crops to. Drawn by scripts/og-card.html from
         the site's own wordmark paths, so a link posted anywhere carries the
         mark rather than the blank a missing og:image leaves behind.

         The path is relative because the site has no domain written down
         anywhere in the repo yet. Slack and Discord resolve that; Facebook
         and X want it absolute, so make these the full URL once the domain
         is settled. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="THE MOMENT — 광주소프트웨어마이스터고 학생 개발팀"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <!-- The ink the hero band turns, so a mobile browser's chrome carries the
         page's colour rather than sitting white above it. -->
    <meta name="theme-color" content="#292b2f" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- The variable font, cut into subsets by unicode range, rather than the
         static family. Static Pretendard ships one file per weight covering
         every glyph it knows: 748KB for Regular, 767 for SemiBold, 773 for
         Bold, and the same again for the Light the navigation is set in —
         three megabytes of font for a page whose own code is 230KB. None of
         it is subsetted, so a visitor downloads every Hanja and every Latin
         glyph to read a screen of Korean.

         The variable file carries 45 to 920 in one family and the stylesheet
         splits it into 92 ranges, so only the ranges a page actually uses
         come down. It sets font-display: swap itself, which is also what
         stops the text hiding while the font arrives. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Everything above the script is a heading, a description and a list of
         links; everything a visitor actually reads is drawn by React into the
         empty div above. So a client that does not run JavaScript — a reader
         who has turned it off, a request that fails halfway, a crawler that
         does not execute — receives a page whose entire body is one empty
         div. Google renders JavaScript; Naver and Daum are far less reliable
         about it, and they are where this team's visitors search.

         This is the page in the plainest terms it can be put: who the team
         is, what it has built, and where to find it. It is inert the moment
         React mounts, so it costs a visitor with JavaScript nothing but the
         bytes. Keep it in step with the sections it stands in for. -->
    <noscript>
      <div
        style="
          max-width: 720px;
          margin: 0 auto;
          padding: 48px 20px;
          font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
          color: #292b2f;
          line-height: 1.6;
        "
      >
        <p style="margin: 0; font-weight: 700">광주소프트웨어마이스터고 학생 개발팀</p>
        <h1 style="margin: 4px 0 24px; font-size: 40px; color: #4a80f8">더모먼트</h1>

        <p>
          더모먼트팀은 광주소프트웨어마이스터고등학교의 전공 동아리입니다. 약
          30명의 재학생, 졸업생들이 모여서 활동하고, 주로 학교에 필요한 서비스를
          개발합니다.
        </p>
        <p>작은 불편도 그냥 지나치지 않습니다. 불편을 마주하는 매 순간을 다시 설계합니다.</p>

        <h2 style="margin: 40px 0 12px; font-size: 24px">Our Project</h2>
        <ul style="margin: 0; padding-left: 20px">
          <li><strong>DataGSM</strong> — 광주소프트웨어마이스터고등학교 OpenAPI &amp; OAuth 플랫폼</li>
          <li><strong>HelloGSM</strong> — 광주소프트웨어마이스터고 입학지원시스템</li>
          <li><strong>ReadyGSM</strong> — 학과체험 및 입학설명회 신청 서비스</li>
          <li><strong>EveryGSM</strong> — 광주소프트웨어마이스터고등학교의 모든 프로젝트를 한곳에</li>
        </ul>

        <h2 style="margin: 40px 0 12px; font-size: 24px">Contact</h2>
        <ul style="margin: 0; padding-left: 20px">
          <li>
            <a href="https://www.instagram.com/team.the_moment/" style="color: #4a80f8"
              >Instagram</a
            >
          </li>
          <li>
            <a href="https://github.com/themoment-team" style="color: #4a80f8">GitHub</a>
          </li>
        </ul>

        <p style="margin-top: 40px; color: #555962; font-size: 14px">
          이 페이지의 나머지 부분은 자바스크립트로 그려집니다. 브라우저에서
          자바스크립트를 켜면 전체 내용을 볼 수 있습니다.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
